aid: halter
name: Halter
description: 'Halter is a New Zealand-founded agri-technology company that builds GPS-enabled,
  solar-powered smart collars for cattle paired with a mobile and web app, letting farmers
  set and move virtual fences, remotely shift and hold herds, and monitor animal location,
  behavior, heat and health without physical fencing or manual labor. The platform combines
  wearable IoT devices (including direct-to-satellite connectivity) with pasture-management
  and grazing-allocation tools for dairy and beef operations. Halter operates across New
  Zealand, Australia and the United States and is backed by Bessemer Venture Partners, Bond
  Capital and DCVC. No public developer API surface has been identified; this profile captures
  the company identity, web properties and domain-security posture.'
